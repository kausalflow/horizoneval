[project]
name = "horizoneval"
version = "0.0.1"
description = "Evaluate time series forecasts from any tool (horizoneval, TimeCopilot, Nixtla) with formal, reproducible tests"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/kausalflow/horizoneval"
Documentation = "https://kausalflow.com/horizoneval/"
Repository = "https://github.com/kausalflow/horizoneval"
Issues = "https://github.com/kausalflow/horizoneval/issues"

[project.optional-dependencies]
# foundation models and statistical references through TimeCopilot (same pin as extrapolation-as-forecasts)
tsfm = ["timecopilot==0.0.35"]
# GIFT-Eval data on disk
gift = ["datasets", "huggingface_hub[cli]"]
# M4 replication: unpack the participants' submitted forecast files (.rar) with the system libarchive
replicate = ["libarchive-c"]
# MCP server exposing the horizoneval tools to AI assistants (horizoneval-mcp)
mcp = ["mcp>=2.3,<3"]
# physics-inspired neural forecasters (models/entropic_force.py)
physics = ["torch>=2.2"]

[project.scripts]
horizoneval = "horizoneval.cli:main"
horizoneval-mcp = "horizoneval.mcp_server:main"

[dependency-groups]
dev = ["pytest", "utilsforecast>=0.2.17", "jsonschema"]
docs = [
    "mkdocstrings[python]>=1.0.8",
    "ruff>=0.17.6",
    "zensical>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horizoneval"]
