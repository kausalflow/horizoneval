[project]
name = "flab"
version = "0.0.1"
description = "A workspace for inventing forecasters and benchmarking them against baselines"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
# foundation models and statistical references through TimeCopilot (same pin as extrapolation-as-forecasts)
tsfm = ["timecopilot==0.0.35"]
# GIFT-Eval data on disk
gift = ["datasets", "huggingface_hub[cli]"]

[project.scripts]
flab = "flab.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flab"]
